<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BSOA 1 — Class Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BSOA 1 weekly class schedule — College of Management">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* ============================================================
     DESIGN TOKENS — colors, fluid type scale, 8px spacing system
     ============================================================ */
  :root{
    --paper:#FFF3F8;
    --paper-2:#FBE8F3;
    --rule:#F3CFE3;
    --ink:#5B4160;
    --ink-soft:#9678A0;
    --maroon:#E8759A;
    --gold:#F4C86B;
    --card:#FFFFFF;
    --shadow: 0 4px 14px rgba(216,150,190,0.22), 0 1px 3px rgba(216,150,190,0.18);

    --c-abm1:#FF9AAE;
    --c-abm2:#7FD9C4;
    --c-abm3:#B79CE8;
    --c-ge3:#FFC76B;
    --c-ofad1:#7FC4EE;
    --c-ofad2:#F17CB0;
    --c-ofad3:#8FD68A;
    --c-pe1:#9AA4EA;

    /* 8px spacing scale, expressed in rem so it scales with root font-size */
    --space-1: 0.5rem;   /* 8px  */
    --space-2: 1rem;     /* 16px */
    --space-3: 1.5rem;   /* 24px */
    --space-4: 2rem;     /* 32px */
    --space-6: 3rem;     /* 48px */
    --space-8: 4rem;     /* 64px */
    --space-12: 6rem;    /* 96px */

    /* fluid type scale */
    --step-h1: clamp(2rem, 5vw, 4rem);
    --step-h2: clamp(1.75rem, 4vw, 3rem);
    --step-h3: clamp(1.5rem, 3vw, 2.5rem);
    --step-body: clamp(1rem, 1.2vw, 1.125rem);

    --container-max: 1360px;
    --gutter: clamp(1rem, 4vw, 2.5rem);

    --touch: 44px; /* minimum touch target */
  }

  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 4%, #FFE1EE 0%, transparent 40%),
      radial-gradient(circle at 95% 8%, #E5E0FB 0%, transparent 38%),
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--rule) 28px),
      var(--paper);
    font-family:'Quicksand',sans-serif;
    font-weight:500;
    font-size: var(--step-body);
    line-height:1.6;
    color:var(--ink);
    overflow-x:hidden;
    min-height:100vh;
  }
  img{ max-width:100%; height:auto; display:block; }
  button, input{ font-family:inherit; }
  .visually-hidden{
    position:absolute !important; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0; padding:0; margin:-1px;
  }
  .skip-link{
    position:absolute; left:var(--space-2); top:-100px;
    background:var(--maroon); color:#fff; padding:var(--space-1) var(--space-2);
    border-radius:0 0 10px 10px; z-index:100; transition:top .15s ease;
    text-decoration:none; font-weight:700;
  }
  .skip-link:focus{ top:0; }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--gold); outline-offset:2px;
  }

  /* ============================================================
     CONTAINER — fluid, centered, capped, never fixed-width
     ============================================================ */
  .site-container{
    width:100%;
    max-width: var(--container-max);
    margin:0 auto;
    padding: var(--space-4) var(--gutter) var(--space-8);
    position:relative;
  }

  /* spiral binding — desktop/tablet only decorative flourish */
  .spiral{
    position:absolute;
    left:-14px; top:40px; bottom:40px;
    width:26px;
    display:none;
    flex-direction:column;
    justify-content:space-between;
    pointer-events:none;
  }
  .spiral .ring{
    width:14px;height:14px;border-radius:50%;
    border:3px solid #F0B9D4;
    background:var(--paper);
  }

  /* ============================================================
     HEADER
     ============================================================ */
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap;
    gap: var(--space-2);
    border-bottom:3px dashed var(--rule);
    padding-bottom: var(--space-2);
    margin-bottom: var(--space-1);
    position:relative;
  }
  header.top::after{
    content:"✦";
    position:absolute; right:2px; top:-14px;
    color:var(--gold); font-size:1rem;
  }
  .brand{
    display:flex; align-items:center; gap: var(--space-2);
    min-width:0;
  }
  .seal{
    width:clamp(44px, 8vw, 58px); height:clamp(44px, 8vw, 58px);
    border-radius:50%;
    background:linear-gradient(160deg, #FFD3E4, #E7D6FB);
    display:flex;align-items:center;justify-content:center;
    box-shadow: var(--shadow);
    border:3px solid #fff;
    outline:2px solid var(--rule);
    flex-shrink:0;
    overflow:hidden;
  }
  .seal img{ width:100%; height:100%; object-fit:cover; image-rendering:auto; }
  h1{
    font-family:'Baloo 2',sans-serif; font-weight:700;
    font-size: var(--step-h1);
    margin:0; letter-spacing:-0.3px;
    color:var(--maroon);
    line-height:1.1;
    word-break:break-word;
  }
  .subtitle{
    font-family:'Quicksand',sans-serif; font-weight:600;
    font-size:0.78rem; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-soft); margin:2px 0 0;
  }
  .subtitle::before{ content:"˚ᡣ𐭩 "; }

  /* meta info shown inline on tablet+ */
  .meta-edit{
    display:none;
    font-family:'Quicksand',sans-serif; font-weight:600;
    font-size:0.78rem; color:var(--ink-soft); text-align:right;
    flex-direction:column; gap:2px;
  }
  .meta-edit .nav-link{
    color:var(--maroon); text-decoration:none; font-weight:700; font-size:0.72rem;
    min-height:var(--touch); display:inline-flex; align-items:center; justify-content:flex-end;
  }
  .meta-edit .nav-link:hover{ text-decoration:underline; }

  /* ---------- mobile hamburger menu ---------- */
  .menu-toggle{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px;
    width: var(--touch); height: var(--touch);
    background:var(--card); border:1px solid var(--rule); border-radius:12px;
    box-shadow:var(--shadow);
    cursor:pointer; flex-shrink:0;
  }
  .menu-toggle span{
    display:block; width:20px; height:2.5px; border-radius:2px;
    background:var(--maroon); transition:transform .2s ease, opacity .2s ease;
  }
  .menu-toggle[aria-expanded="true"] span:nth-child(1){ transform:translateY(7.5px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] span:nth-child(2){ opacity:0; }
  .menu-toggle[aria-expanded="true"] span:nth-child(3){ transform:translateY(-7.5px) rotate(-45deg); }

  .mobile-menu{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:16px;
    box-shadow:var(--shadow);
    margin: var(--space-1) 0 var(--space-2);
    padding: var(--space-2);
    display:flex; flex-direction:column; gap: var(--space-1);
  }
  .mobile-menu[hidden]{ display:none; }
  .mobile-menu .row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:0.85rem; color:var(--ink-soft); font-weight:600;
    padding: var(--space-1) var(--space-1);
    border-bottom:1px dashed var(--rule);
  }
  .mobile-menu .row:last-child{ border-bottom:none; }
  .mobile-menu a.nav-link{
    color:var(--maroon); text-decoration:none; font-weight:700;
    min-height:var(--touch); display:flex; align-items:center;
  }

  /* ============================================================
     DAY TABS
     ============================================================ */
  .tabs{
    display:flex; flex-wrap:wrap;
    gap: var(--space-1);
    margin: var(--space-2) 0 0;
  }
  .tab{
    font-family:'Baloo 2',sans-serif; font-weight:600; font-size:0.85rem;
    text-align:center;
    flex:1 1 calc(20% - var(--space-1));
    min-width:5.5rem;
    min-height:var(--touch);
    display:flex; align-items:center; justify-content:center;
    padding: var(--space-1);
    border-radius:16px 16px 6px 6px;
    color:#fff;
    box-shadow: var(--shadow);
    border:none; cursor:pointer;
  }
  .tab.today{
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold), var(--shadow);
  }

  /* ============================================================
     SCHEDULE GRID — tablet/desktop time grid
     ============================================================ */
  .grid-wrap{
    background:var(--card);
    border-radius:22px;
    box-shadow: var(--shadow);
    overflow:hidden;
    border:1px solid var(--rule);
    margin-top: var(--space-2);
    display:none; /* shown from tablet breakpoint up */
  }
  .grid{
    display:grid;
    grid-template-columns: 3.4rem repeat(5, 1fr);
  }
  .time-col{
    font-family:'Quicksand',sans-serif;
    font-size:0.62rem; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:flex-end;
    padding:0 0.4rem;
    border-right:1px solid var(--rule);
    border-top:1px solid #F0F2ED;
    min-height:22px;
  }
  .cell{
    border-right:1px solid #EEF1EA;
    border-top:1px solid #F0F2ED;
    position:relative;
    min-height:22px;
  }
  .cell:last-child{ border-right:none; }

  .lunch{
    grid-column: 1 / -1;
    background: repeating-linear-gradient(135deg, #FFE3EF, #FFE3EF 10px, #FDEEF7 10px, #FDEEF7 20px);
    color:var(--maroon);
    font-family:'Baloo 2',sans-serif; font-weight:600; letter-spacing:2px;
    font-size:0.7rem; text-align:center;
    display:flex; align-items:center; justify-content:center;
    padding:6px 0;
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  }

  .block{
    margin:2px 3px;
    min-width:0; min-height:0;
    border-radius:14px;
    padding:6px 8px;
    color:#fff;
    box-shadow: var(--shadow);
    overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
    transition: transform .12s ease;
    align-self:stretch; justify-self:stretch;
    z-index:2;
  }
  .block:hover{ transform: translateY(-1px) scale(1.01); filter:brightness(1.03); }

  .block.ongoing{
    position:relative;
    overflow:visible;
    animation: ongoingBounce 1.8s ease-in-out infinite, ongoingGlow 2.6s ease-in-out infinite;
    z-index:3;
  }
  @keyframes ongoingBounce{
    0%,100%{ transform:scale(1) rotate(0deg); }
    18%{ transform:scale(1.05) rotate(-1.4deg); }
    38%{ transform:scale(0.985) rotate(1.4deg); }
    58%{ transform:scale(1.04) rotate(-0.8deg); }
    80%{ transform:scale(1) rotate(0.6deg); }
  }
  @keyframes ongoingGlow{
    0%,100%{ box-shadow: 0 4px 14px rgba(216,150,190,0.3), 0 0 0 3px #fff, 0 0 16px 2px rgba(255,214,235,0.9); }
    33%{ box-shadow: 0 4px 14px rgba(216,150,190,0.32), 0 0 0 3px #fff, 0 0 18px 4px rgba(255,196,225,0.95); }
    66%{ box-shadow: 0 4px 14px rgba(216,150,190,0.3), 0 0 0 3px #fff, 0 0 18px 4px rgba(232,214,255,0.9); }
  }
  .sparkle{
    position:absolute;
    top:-4px;
    font-size:10px;
    line-height:1;
    pointer-events:none;
    animation: sparkleFloat 1.9s ease-in-out infinite;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.12));
  }
  @keyframes sparkleFloat{
    0%{ transform:translateY(4px) scale(0.5) rotate(0deg); opacity:0; }
    22%{ opacity:1; }
    55%{ transform:translateY(-11px) scale(1.05) rotate(12deg); opacity:1; }
    100%{ transform:translateY(-22px) scale(0.7) rotate(-10deg); opacity:0; }
  }
  .live-badge{
    display:inline-flex; align-items:center; gap:4px;
    align-self:flex-start;
    font-family:'Quicksand',sans-serif; font-weight:700;
    font-size:8.5px; letter-spacing:0.4px; text-transform:uppercase;
    background:rgba(255,255,255,0.92); color:var(--maroon);
    padding:2px 7px; border-radius:9px; margin-bottom:3px;
    white-space:nowrap;
  }
  .live-badge .dot{
    width:6px;height:6px;border-radius:50%; background:#39C97B;
    animation: liveBlink 1.1s ease-in-out infinite;
    flex-shrink:0;
  }
  .live-badge .heart{
    display:inline-block; font-size:8px;
    animation: heartBeat 1s ease-in-out infinite;
  }
  @keyframes liveBlink{ 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }
  @keyframes heartBeat{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.3); } }
  @media (prefers-reduced-motion: reduce){
    .block.ongoing{ animation:none; }
    .live-badge .dot{ animation:none; }
    .live-badge .heart{ animation:none; }
    .sparkle{ display:none; }
  }

  .block .code{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:0.72rem; line-height:1.15; }
  .block .room{ font-family:'Quicksand',sans-serif; font-size:0.6rem; opacity:0.92; margin-top:1px; }
  .block .who{ font-family:'Quicksand',sans-serif; font-size:0.6rem; font-weight:600; opacity:0.95; margin-top:1px; }

  /* ============================================================
     MOBILE AGENDA — stacked per-day list (no horizontal scroll)
     ============================================================ */
  .agenda{
    margin-top: var(--space-2);
    display:flex; flex-direction:column; gap: var(--space-3);
  }
  .agenda-day{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
    scroll-margin-top: 1rem;
  }
  .agenda-day-head{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem;
    color:#fff;
    padding: var(--space-1) var(--space-2);
    display:flex; align-items:center; justify-content:space-between;
  }
  .agenda-day-head .today-flag{
    font-size:0.65rem; text-transform:uppercase; letter-spacing:1px;
    background:rgba(255,255,255,0.9); color:var(--maroon);
    padding:2px 8px; border-radius:9px; font-family:'Quicksand',sans-serif; font-weight:700;
  }
  .agenda-list{
    display:flex; flex-direction:column;
  }
  .agenda-item{
    display:flex; gap: var(--space-2);
    padding: var(--space-2);
    border-top:1px solid #F0F2ED;
    align-items:flex-start;
  }
  .agenda-item:first-child{ border-top:none; }
  .agenda-item .swatch-bar{
    width:6px; align-self:stretch; border-radius:4px; flex-shrink:0; min-height:44px;
  }
  .agenda-item .info{ min-width:0; flex:1; }
  .agenda-item .code{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem; color:var(--ink); }
  .agenda-item .time{ font-size:0.85rem; color:var(--maroon); font-weight:700; margin-top:2px; }
  .agenda-item .room{ font-size:0.8rem; color:var(--ink-soft); margin-top:2px; }
  .agenda-item.ongoing{ background:var(--paper-2); }
  .agenda-lunch{
    text-align:center; font-family:'Baloo 2',sans-serif; font-weight:600; letter-spacing:2px;
    font-size:0.7rem; color:var(--maroon); padding: var(--space-1);
    background: repeating-linear-gradient(135deg, #FFE3EF, #FFE3EF 10px, #FDEEF7 10px, #FDEEF7 20px);
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  }
  .agenda-empty{ padding: var(--space-2); color:var(--ink-soft); font-size:0.85rem; text-align:center; }

  /* ============================================================
     TOOLBAR + LEGEND
     ============================================================ */
  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap: var(--space-1);
    margin: var(--space-4) 0 var(--space-2);
  }
  .toolbar h2{
    font-family:'Baloo 2',sans-serif; font-size: clamp(1.15rem, 2.4vw, 1.4rem); margin:0;
  }
  button.primary, button.ghost{
    font-family:'Quicksand',sans-serif; font-weight:600; font-size:0.85rem;
    border-radius:20px; cursor:pointer; box-shadow:var(--shadow);
    min-height:var(--touch); padding:0 var(--space-2);
  }
  button.primary{ background:var(--maroon); color:#fff; border:none; }
  button.primary:hover{ background:#D9558B; }
  button.ghost{ background:transparent; border:2px solid var(--rule); color:var(--ink); }

  .btn-group{ display:flex; gap: var(--space-1); flex-wrap:wrap; }

  table.legend{
    width:100%; border-collapse:collapse;
    background:var(--card); border-radius:20px;
    box-shadow:var(--shadow); border:1px solid var(--rule);
  }
  table.legend th{
    font-family:'Quicksand',sans-serif; font-size:0.65rem; letter-spacing:1px;
    text-transform:uppercase; color:var(--ink-soft);
    background:var(--paper-2); text-align:left; padding: var(--space-1) var(--space-2);
    border-bottom:1px solid var(--rule);
  }
  table.legend td{
    padding: var(--space-1) var(--space-2); font-size:0.85rem; border-bottom:1px solid #F0F2ED;
    vertical-align:middle;
  }
  table.legend tr:last-child td{ border-bottom:none; }
  .swatch{
    display:inline-block; width:10px;height:10px;border-radius:3px; margin-right:8px;
    vertical-align:middle; flex-shrink:0;
  }
  .code-cell{ font-family:'Baloo 2',sans-serif; font-weight:700; }
  .num{ font-family:'Quicksand',sans-serif; text-align:center; }
  .totals-row td{ background:var(--paper-2); font-weight:700; font-family:'Quicksand',sans-serif; }

  body.capturing .toolbar{ display:none; }
  body.capturing .meta-edit .nav-link{ display:none; }
  body.capturing .menu-toggle{ display:none; }

  /* ============================================================
     RESPONSIVE TABLE — card rows below tablet breakpoint
     ============================================================ */
  @media (max-width:767.98px){
    table.legend, table.legend thead, table.legend tbody, table.legend tfoot,
    table.legend th, table.legend td, table.legend tr{ display:block; width:100%; }
    table.legend thead{
      position:absolute; width:1px; height:1px; overflow:hidden;
      clip:rect(0 0 0 0); white-space:nowrap; border:0; padding:0; margin:-1px;
    }
    table.legend tr{
      border-bottom:1px solid var(--rule);
      padding: var(--space-2);
    }
    table.legend tr:last-child{ border-bottom:none; }
    table.legend td{
      border-bottom:none; padding: 0.2rem 0; display:flex; justify-content:space-between; gap:var(--space-2);
    }
    table.legend td::before{
      content: attr(data-label);
      font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.68rem;
      text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft);
      flex-shrink:0;
    }
    table.legend td.code-cell{ display:flex; justify-content:flex-start; }
    table.legend td.code-cell::before{ display:none; }
    table.legend .num{ text-align:right; }
    table.legend .totals-row{ background:var(--paper-2); }
  }

  /* ============================================================
     BREAKPOINTS
     Mobile: 320–767 (base styles above)
     Tablet: 768–1023
     Desktop: 1024–1439
     Large desktop: 1440+
     ============================================================ */

  /* ---- Tablet and up: show the time grid, hide the agenda ---- */
  @media (min-width:768px){
    .spiral{ display:flex; }
    .site-container{ padding-left: calc(var(--gutter) + 18px); }
    .meta-edit{ display:flex; }
    .menu-toggle, .mobile-menu{ display:none; }

    .grid-wrap{ display:block; }
    .agenda{ display:none; }

    .tabs{ grid-template-columns: 3.4rem repeat(5,1fr); display:grid; }
    .tabs::before{ content:""; }
    .tab{ flex:none; }

    .grid{ grid-template-columns: 3.4rem repeat(5, 1fr); }
    .time-col{ font-size:0.6rem; padding:0 0.3rem; }
    .block .room, .block .who{ display:none; }
  }

  /* ---- Desktop ---- */
  @media (min-width:1024px){
    .grid{ grid-template-columns: 4.75rem repeat(5, 1fr); }
    .tabs{ grid-template-columns: 4.75rem repeat(5,1fr); }
    .time-col{ font-size:0.66rem; padding:0 0.5rem; }
    .block .room, .block .who{ display:block; }
    .block .code{ font-size:0.8rem; }
  }

  /* ---- Large desktop ---- */
  @media (min-width:1440px){
    .site-container{ padding-left: calc(var(--gutter) + 26px); }
    .grid{ grid-template-columns: 5.5rem repeat(5, 1fr); }
    .tabs{ grid-template-columns: 5.5rem repeat(5,1fr); }
    .time-col{ font-size:0.72rem; }
    .block{ padding:8px 10px; }
    .block .code{ font-size:0.85rem; }
    .block .room, .block .who{ font-size:0.68rem; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to schedule</a>

<div class="site-container">
  <div class="spiral" id="spiral"></div>

function timeToSlot(t){
  const [h,m] = t.split(':').map(Number);
  return (h - START_HOUR)*2 + (m>=30?1:0);
}
function slotToTime(s){
  const h = START_HOUR + Math.floor(s/2);
  const m = (s%2)*30;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function fmt12(t){
  let [h,m] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM';
  let hh = h%12; if(hh===0) hh=12;
  return hh+':'+String(m).padStart(2,'0')+' '+ap;
}

  const todayIdx = new Date().getDay()-1; // Mon=0 ... Fri=4, Sat/Sun = out of range
  tabs.innerHTML = '<div class="spacer" aria-hidden="true"></div>' + DAYS.map((d,i)=>
    `<button type="button" class="tab ${i===todayIdx?'today':''}" style="background:${DAY_TAB_COLORS[i]}" data-day="${i}"><span class="visually-hidden">${d}</span><span aria-hidden="true">${DAYS_SHORT[i]}</span></button>`
  ).join('');
  tabs.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = document.getElementById('agenda-day-'+btn.dataset.day);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

/* ---------- render grid (tablet/desktop) ---------- */
function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.style.gridTemplateRows = `repeat(${SLOTS}, minmax(22px,auto))`;

  const lunchStartSlot = timeToSlot('12:00');
  const lunchEndSlot = timeToSlot('13:00');

  let row = 1;
  for(let s=0; s<SLOTS; s++){
    if(s === lunchStartSlot){
      const lunch = document.createElement('div');
      lunch.className='lunch';
      lunch.style.gridRow = `${row} / ${row + (lunchEndSlot-lunchStartSlot)}`;
      lunch.style.gridColumn = '1 / -1';
      lunch.textContent = '✿ Lunch Break ✿';
      grid.appendChild(lunch);
      s = lunchEndSlot - 1;
      row += (lunchEndSlot-lunchStartSlot);
      continue;
    }

    const t = slotToTime(s);
    const timeCell = document.createElement('div');
    timeCell.className = 'time-col';
    timeCell.style.gridRow = row;
    timeCell.style.gridColumn = 1;
    timeCell.textContent = (s%2===0) ? fmt12(t) : '';
    grid.appendChild(timeCell);

    for(let d=0; d<5; d++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.gridRow = row;
      cell.style.gridColumn = d+2;
      cell.dataset.day = d;
      cell.dataset.slot = s;
      grid.appendChild(cell);
    }
    row++;
  }

  classes.forEach(c=>{
    const subj = subjectById(c.subjId);
    if(!subj) return;
    let startSlot = timeToSlot(c.start);
    let endSlot = timeToSlot(c.end);
    const r1 = startSlot+1;
    const r2 = endSlot+1;

    const block = document.createElement('div');
    block.className = 'block';
    block.style.gridRow = `${r1} / ${r2}`;
    block.style.gridColumn = c.day+2;
    block.style.background = subj.color;
    block.innerHTML = `<div class="code">${subj.code}</div><div class="room">${c.room||''}</div><div class="who">${fmt12(c.start)}–${fmt12(c.end)}</div>`;
    if(isOngoing(c)){
      block.classList.add('ongoing');
      const badge = document.createElement('div');
      badge.className = 'live-badge';
      badge.innerHTML = '<span class="dot"></span>now · '+timeLeftLabel(c)+' <span class="heart">💗</span>';
      block.prepend(badge);

      const sparkleEmojis = ['✨','⭐','💫','🎀'];
      for(let i=0;i<3;i++){
        const sp = document.createElement('span');
        sp.className = 'sparkle';
        sp.textContent = sparkleEmojis[(i*2+Math.floor(Math.random()*sparkleEmojis.length))%sparkleEmojis.length];
        sp.style.left = (8 + i*32 + Math.random()*14)+'%';
        sp.style.animationDelay = (i*0.55)+'s';
        block.appendChild(sp);
      }
    }
    grid.appendChild(block);
  });
}

/* ---------- render agenda (mobile stacked list) ---------- */
function renderAgenda(){
  const agenda = document.getElementById('agenda');
  agenda.innerHTML = '';
  const { dayIndex: todayIdx } = getNowInfo();

  DAYS.forEach((dayName, d)=>{
    const dayClasses = classes
      .filter(c=>c.day===d)
      .slice()
      .sort((a,b)=> a.start.localeCompare(b.start));

    const section = document.createElement('section');
    section.className = 'agenda-day';
    section.id = 'agenda-day-'+d;

    const head = document.createElement('div');
    head.className = 'agenda-day-head';
    head.style.background = DAY_TAB_COLORS[d];
    head.innerHTML = `<span>${dayName}</span>${d===todayIdx?'<span class="today-flag">Today</span>':''}`;
    section.appendChild(head);

    const list = document.createElement('div');
    list.className = 'agenda-list';

    if(dayClasses.length === 0){
      const empty = document.createElement('div');
      empty.className = 'agenda-empty';
      empty.textContent = 'No classes scheduled.';
      list.appendChild(empty);
    } else {
      let lunchInserted = false;
      dayClasses.forEach(c=>{
        if(!lunchInserted && c.start >= '13:00'){
          const lunch = document.createElement('div');
          lunch.className = 'agenda-lunch';
          lunch.textContent = '✿ Lunch Break · 12:00 PM – 1:00 PM ✿';
          list.appendChild(lunch);
          lunchInserted = true;
        }
        const subj = subjectById(c.subjId);
        if(!subj) return;
        const item = document.createElement('div');
        item.className = 'agenda-item' + (isOngoing(c) ? ' ongoing' : '');
        item.innerHTML = `
          <div class="swatch-bar" style="background:${subj.color}"></div>
          <div class="info">
            <div class="code">${subj.code}${isOngoing(c) ? ' <span class="live-badge" style="position:relative;top:-1px"><span class="dot"></span>now · '+timeLeftLabel(c)+'</span>' : ''}</div>
            <div class="time">${fmt12(c.start)} – ${fmt12(c.end)}</div>
            <div class="room">${c.room ? '📍 '+c.room : ''}</div>
          </div>`;
        list.appendChild(item);
      });
    }

    section.appendChild(list);
    agenda.appendChild(section);
  });
}

function getNowInfo(){
  const now = new Date();
  const dayIndex = now.getDay()-1; // Mon=0 ... Fri=4; Sat/Sun fall outside 0-4
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  return { dayIndex, time: hh+':'+mm };
}
function isOngoing(c){
  const { dayIndex, time } = getNowInfo();
  return c.day === dayIndex && time >= c.start && time < c.end;
}

/* ---------- time left on an ongoing class ---------- */
function timeLeftLabel(c){
  const now = new Date();
  const [eh, em] = c.end.split(':').map(Number);
  const end = new Date(now);
  end.setHours(eh, em, 0, 0);
  let diffMin = Math.max(0, Math.ceil((end - now)/60000));
  if(diffMin >= 60){
    const h = Math.floor(diffMin/60), m = diffMin%60;
    return h+'h'+(m>0? ' '+m+'m':'')+' left';
  }
  return diffMin+'m left';
}

/* ---------- legend table ---------- */
function renderLegend(){
  const body = document.getElementById('legendBody');
  body.innerHTML = '';
  let lecTotal=0, labTotal=0;
  subjects.forEach(s=>{
    lecTotal += Number(s.lec)||0;
    labTotal += Number(s.lab)||0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="code-cell" data-label=""><span class="swatch" style="background:${s.color}"></span>${s.code}</td>
      <td data-label="Description">${s.desc}</td>
      <td class="num" data-label="Lec">${s.lec||''}</td>
      <td class="num" data-label="Lab">${s.lab||''}</td>
      <td data-label="Instructor">${s.instructor}</td>
    `;
    body.appendChild(tr);
  });
  document.getElementById('lecTotal').textContent = lecTotal;
  document.getElementById('labTotal').textContent = labTotal;
  document.getElementById('grandTotal').textContent = 'Total: '+(lecTotal+labTotal)+' units';
}

/* ---------- spiral rings ---------- */
function renderSpiral(){
  const el = document.getElementById('spiral');
  el.innerHTML = Array.from({length:14}).map(()=>'<div class="ring"></div>').join('');
}

/* ---------- mobile menu toggle ---------- */
const menuToggle = document.getElementById('menuToggle');
const mobileMenu = document.getElementById('mobileMenu');
menuToggle.addEventListener('click', ()=>{
  const open = menuToggle.getAttribute('aria-expanded') === 'true';
  menuToggle.setAttribute('aria-expanded', String(!open));
  mobileMenu.hidden = open;
});

/* ---------- save as image (works from either button) ---------- */
async function downloadSchedule(){
  const btns = [document.getElementById('downloadBtn'), document.getElementById('downloadBtnMobile')];
  const originals = btns.map(b=>b.textContent);
  btns.forEach(b=>b.textContent = 'Preparing…');
  document.body.classList.add('capturing');
  mobileMenu.hidden = true;
  menuToggle.setAttribute('aria-expanded','false');
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const canvas = await html2canvas(document.querySelector('.site-container'), {
      backgroundColor: '#FFF3F8',
      scale: 2,
      useCORS: true
    });
    const link = document.createElement('a');
    const title = document.getElementById('courseTitle').textContent.trim().replace(/\s+/g,'-').toLowerCase() || 'schedule';
    link.download = title + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(err){
    console.error(err);
    alert('Sorry, the image export failed — please try again.');
  }finally{
    document.body.classList.remove('capturing');
    btns.forEach((b,i)=>b.textContent = originals[i]);
  }
}
document.getElementById('downloadBtn').addEventListener('click', downloadSchedule);
document.getElementById('downloadBtnMobile').addEventListener('click', downloadSchedule);

/* ---------- persistence (read-only) ---------- */
const STORAGE_KEY = 'schedule-manager-data';
function loadAll(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data.subjects) subjects = data.subjects;
      if(data.classes) classes = data.classes;
      if(data.title){
        document.getElementById('courseTitle').textContent = data.title;
      }
      if(data.sem){
        document.getElementById('semField').textContent = data.sem;
        document.getElementById('semFieldMobile').textContent = data.sem;
      }
      if(data.year){
        document.getElementById('yearField').textContent = data.year;
        document.getElementById('yearFieldMobile').textContent = data.year;
      }
    }
  }catch(e){ /* no saved data yet */ }
}

// live-update this page whenever the admin page saves changes (same browser/device)
window.addEventListener('storage', (e)=>{
  if(e.key === STORAGE_KEY){
    loadAll();
    renderGrid();
    renderAgenda();
    renderLegend();
  }
});

/* ---------- init ---------- */
(function init(){
  renderSpiral();
  renderTabs();
  loadAll();
  renderGrid();
  renderAgenda();
  renderLegend();
  setInterval(()=>{ renderGrid(); renderAgenda(); }, 15000); // keep the "now" highlight + time-left countdown fresh
})();
</script>
